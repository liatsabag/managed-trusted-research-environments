version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-gcp-rr-hub-core}
      - GCP_REGION=${GCP_REGION:-me-west1}
      - HUB_REGISTRY_DATASET=${HUB_REGISTRY_DATASET:-hub_registry}
      - HUB_TELEMETRY_DATASET=${HUB_TELEMETRY_DATASET:-hub_telemetry}
      - ENVIRONMENT=development
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
