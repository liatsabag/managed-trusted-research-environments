<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GCP Health Data Platform - Central Administrator Portal</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0066da',
              600: '#0052b4',
              700: '#003f8c',
              800: '#002f6c',
              900: '#001e47',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.125rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-badge-active { background-color: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .status-badge-downgraded { background-color: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .status-badge-suspended { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .countdown-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.125rem 0.5rem;
      border-radius: 0.375rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .countdown-safe { background-color: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .countdown-warning { background-color: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .countdown-urgent { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Top Application Header with Navigation Tabs & Persona Switcher -->
  <header id="header-container" class="sticky top-0 z-40 bg-slate-900 text-white shadow-md border-b border-slate-800"></header>

  <!-- Main Content Area: Overview, Rooms, Room Details, Researchers, Audit Logs, Compliance, FinOps -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- View 1: Main Dashboard Page (Fleet Overview) -->
    <section id="view-overview" class="view-panel"></section>

    <!-- View 2: Rooms Page (Fleet Table) -->
    <section id="view-fleet" class="view-panel hidden"></section>

    <!-- View 3: Dedicated Room Details Page -->
    <section id="view-room-detail" class="view-panel hidden"></section>

    <!-- View: Cloud Infrastructure, Buckets & Environment Management -->
    <section id="view-resources" class="view-panel hidden"></section>

    <!-- View: Airlock Data Egress Governance & Gemini Risk Scanner -->
    <section id="view-airlock" class="view-panel hidden"></section>

    <!-- View 4: Dedicated Researchers Page -->
    <section id="view-researchers" class="view-panel hidden"></section>

    <!-- View 5: Dedicated Audit Logs Page -->
    <section id="view-audit-logs" class="view-panel hidden"></section>

    <!-- View 6: 5-Item Statutory Compliance Page -->
    <section id="view-compliance" class="view-panel hidden"></section>

    <!-- View 7: FinOps & Cost Attribution Page -->
    <section id="view-finops" class="view-panel hidden"></section>

    <!-- View 8: Standardized & Ad-Hoc Governance Reports -->
    <section id="view-reports" class="view-panel hidden"></section>
  </main>

  <!-- Modals & Drawers Container -->
  <div id="modals-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Application Bootstrap (ES6 Modules) with Cache Buster -->
  <script type="module" src="js/app.js?v=2.2.0"></script>
</body>
</html>
