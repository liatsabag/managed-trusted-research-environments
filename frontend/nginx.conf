server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API calls to Cloud Run backend.
    # NOTE: Replace with your deployed backend Cloud Run URL (automated via sed in DEPLOYMENT.md Step 3.2).
    location /api/ {
        proxy_pass https://gcp-rr-hub-backend-YOUR_BACKEND_HASH.me-west1.run.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host gcp-rr-hub-backend-YOUR_BACKEND_HASH.me-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (no-cache for JS/CSS during active updates)
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|ttf)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
